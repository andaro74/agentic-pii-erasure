[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-pii-erasure"
version = "0.1.0"
description = "Agentic, auditable, multi-system PII erasure on AWS. Agent proposes, saga disposes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["gdpr", "erasure", "langgraph", "langchain", "bedrock", "mcp", "saga", "pii"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  # ⚠️ THE DURABILITY LAYER IS PINNED, NOT RANGED (ADR-014).
  # In-flight checkpoints span a 30-day grace window; a serialization change
  # mid-window strands live erasure requests silently. Serialization lives in
  # the checkpoint packages as much as in langgraph itself, so they move in
  # lockstep, gated by scripts/upgrade_canary.sh. Verified on PyPI 2026-07-24.
  # A committed lockfile (uv or pip-tools) covers the transitive layer below.
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "langchain>=1.0,<2",                     # agents + middleware
  "langchain-aws>=1.0,<2",                 # ChatBedrockConverse
  "langchain-mcp-adapters>=0.3,<1",        # MCP participants as LangChain tools
  "mcp>=1.2",
  "boto3>=1.34",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "moto[all]>=5.0",
]
# Production checkpointer. Local dev uses SQLite and does not need this.
postgres = ["langgraph-checkpoint-postgres==3.1.0", "psycopg[binary,pool]>=3.1"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
# Validates policies/cedar/*.cedar against a real Cedar engine.
cedar = ["cedarpy>=3.2"]
infra = ["aws-cdk-lib>=2.150", "constructs>=10.3"]

[project.scripts]
erasure = "pii_erasure.cli.main:app"

[project.urls]
Homepage = "https://github.com/YOUR-ORG/agentic-pii-erasure"
Architecture = "https://github.com/YOUR-ORG/agentic-pii-erasure/blob/main/docs/ARCHITECTURE.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_erasure"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
"seeds/**" = ["S"]
"infra/**" = ["N802", "N803"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "langchain_aws.*", "langchain_mcp_adapters.*", "mcp.*", "cedarpy.*", "aws_cdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "conformance: participant contract conformance suite",
  "integration: full saga run, slower",
  "adversarial: prompt-injection corpus",
  "upgrade_canary: pause/resume across a framework version bump (ADR-014)",
]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/pii_erasure"]
branch = true
