name: CI

# Two gates, because there is no local mode (ADR-017).
#
#   hermetic : lint · unit · policy · cdk synth. No AWS account, no cost. Always runs.
#   deployed : an EPHEMERAL stack — create, seed, evaluate, DESTROY — in one job.
#              Needs OIDC credentials, costs money, and tears down on always().
#
# Green from commit zero — milestone-gated make targets print "⏳ lands at Mx" and
# exit 0 until their stage's entry file exists, then become mandatory automatically
# (Makefile + docs/ROADMAP.md rule 4). Do not add steps that assume a later milestone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # HERMETIC — no AWS account. This is the gate every commit must leave green.
  # ─────────────────────────────────────────────────────────────────────────────
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"        # exact-pinned deps predate 3.13/3.14 — see ADR-016

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install (venv + dev extras)
        run: make install

      # lint + unit + policy + cdk synth. The synth-time IAM assertions live in
      # tests/unit and cover invariants 12 and 14 — see infra/README.md.
      - name: make check
        run: make check

  # ─────────────────────────────────────────────────────────────────────────────
  # DEPLOYED — ephemeral stack. Costs money. Skipped when no OIDC role is set,
  # which is what happens on a fork PR; ADR-020 records that as a known gap and
  # break-glass as a LOGGED EXCEPTION, never a default.
  # ─────────────────────────────────────────────────────────────────────────────
  deployed:
    needs: hermetic
    runs-on: ubuntu-latest
    if: vars.AWS_CI_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write                   # OIDC — no long-lived keys in this repo, ever
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PII_ERASURE_STAGE: pr-${{ github.run_id }}
      PII_ERASURE_MODEL_ID: ${{ vars.PII_ERASURE_MODEL_ID }}
      PII_ERASURE_DEV_OBJECT_LOCK_DAYS: "1"   # or the archive bucket cannot be torn down
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (venv + dev extras)
        run: make install

      - name: Assume the CI role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy the ephemeral stack
        run: make deploy-dev

      # Ground truth is emitted in the same pass that writes the data — ADR-020.
      - name: Seed + emit ground truth
        run: make seed

      - name: Conformance — 5 verbs x 8 participants
        run: make conformance

      - name: Full three-phase saga (integration)
        run: make integration

      - name: Discovery recall gate (== 1.0)
        run: make eval

      - name: Adversarial corpus (tool absent, or policy denied and logged)
        run: make eval-adversarial

      # always(): a failed run must not leak resources. Since ADR-021 removed the
      # last continuously-billing component the cost of a leak is small, but a
      # leaked Object Lock bucket still cannot be deleted until retention expires.
      - name: Destroy the ephemeral stack
        if: always()
        run: make destroy-dev

  # ─────────────────────────────────────────────────────────────────────────────
  # RELEASE GATE — only when the pinned durability packages change (ADR-016).
  # Pause a saga on the BASE versions, bump to the PR's versions, assert clean resume.
  #
  # The direction is the whole gate, and this job used to have it backwards (V13-2). It
  # fires *because* pyproject's pins changed, so the checkout already holds the NEW
  # versions — running the canary here without arguments paused and resumed on the same
  # version and reported success for a transition it never tested. So the tree is rolled
  # back to the base commit's pins first, the venv is installed from THOSE, and the PR's
  # versions are handed to the canary as its targets. Anything else is a different test.
  # ─────────────────────────────────────────────────────────────────────────────
  upgrade-canary:
    needs: hermetic
    runs-on: ubuntu-latest
    if: vars.AWS_CI_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PII_ERASURE_STAGE: canary-${{ github.run_id }}
      PII_ERASURE_MODEL_ID: ${{ vars.PII_ERASURE_MODEL_ID }}
      PII_ERASURE_DEV_OBJECT_LOCK_DAYS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # need history to diff against the true base, not just HEAD~1

      - name: Did the pinned durability layer change?
        id: pins
        # Compare against the right base per event: a PR diffs its merge-base with
        # the target branch; a push diffs the before-SHA. HEAD~1 alone would miss a
        # pin bump buried in a multi-commit push — a canary that doesn't notice the
        # bump is a gate that can't gate.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
            RANGE="$BASE...HEAD"
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -q '^0*$'; then
            BASE="${{ github.event.before }}"
            RANGE="$BASE..HEAD"
          else
            BASE="HEAD~1"           # fallback: first push / workflow_dispatch
            RANGE="$BASE..HEAD"
          fi
          if ! git diff --unified=0 "$RANGE" -- pyproject.toml \
               | grep -qE '^\+.*"langgraph(-checkpoint-aws)?=='; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pins unchanged in $RANGE — canary not required for this change."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # The base ref, so the tree can be rolled back to the versions a paused saga
          # would really have been checkpointed by. Set per event above rather than parsed
          # back out of $RANGE — a branch name containing a dot would defeat that.
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          # The PR's versions become the canary's TARGETS. Read from the file rather than
          # from the diff: a bump that rewraps the line, or moves it, still yields the
          # right version, and there is exactly one exact pin per package.
          pin() { grep -oE "^  \"$1==[0-9][^\"]*\"" pyproject.toml | grep -oE '[0-9][^"]*'; }
          HEAD_LG="$(pin langgraph)"
          HEAD_CP="$(pin langgraph-checkpoint-aws)"
          if [ -z "$HEAD_LG" ] || [ -z "$HEAD_CP" ]; then
            echo "::error::could not read both pins from pyproject.toml — refusing to run a canary that cannot name its own targets"
            exit 1
          fi
          echo "head_langgraph=$HEAD_LG" >> "$GITHUB_OUTPUT"
          echo "head_checkpoint=$HEAD_CP" >> "$GITHUB_OUTPUT"
          echo "Canary targets: langgraph $HEAD_LG · langgraph-checkpoint-aws $HEAD_CP"

      - uses: actions/setup-python@v7
        if: steps.pins.outputs.changed == 'true'
        with:
          python-version: "3.12"

      # BEFORE install, so the venv holds the versions the pause is checkpointed by. The
      # canary bumps all three pin locations itself (V12-6), so all three must start at
      # base — rolling back only pyproject would leave SAGA_PINS ahead and `make check`
      # would fail inside the canary for a reason that is this workflow's fault.
      - name: Roll the pins back to the base commit — the pause must happen on the OLD version
        if: steps.pins.outputs.changed == 'true'
        run: |
          git checkout "${{ steps.pins.outputs.base }}" -- pyproject.toml Makefile requirements.lock
          echo "Paused-on versions:"; grep -E '"langgraph(-checkpoint-aws)?==' pyproject.toml

      - name: Install (venv + dev extras)
        if: steps.pins.outputs.changed == 'true'
        run: make install

      - name: Assume the CI role (OIDC)
        if: steps.pins.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy the canary stack
        if: steps.pins.outputs.changed == 'true'
        run: make deploy-dev

      - name: Upgrade canary — pause on base, bump to the PR's pins, resume
        if: steps.pins.outputs.changed == 'true'
        run: |
          make upgrade-canary \
            LANGGRAPH="${{ steps.pins.outputs.head_langgraph }}" \
            CHECKPOINT_AWS="${{ steps.pins.outputs.head_checkpoint }}"

      - name: Destroy the canary stack
        if: always() && steps.pins.outputs.changed == 'true'
        run: make destroy-dev
